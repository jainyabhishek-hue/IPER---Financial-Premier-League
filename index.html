                { q: "IndiGo pays aviation turbine fuel (ATF) supply companies ₹220 Cr cash via corporate bank accounts.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Fuel expenditure drops liquid bank cash Assets and reduces operational Equity through fueling expenses." },
                { q: "IndiGo advances ₹150 Cr cash to Airbus as a reservation deposit for upcoming passenger jets.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Capital advances shift liquid cash Assets into specialized current capital advance Assets." },
                { q: "IndiGo settles its monthly flight crew and airport operations staff salary pools of ₹95 Cr.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Operations payroll lowers liquid bank cash Assets and deflates core Equity via operational talent expenses." },
                { q: "IndiGo pays airport landing and parking infrastructure usage charges of ₹40 Cr to GMR Airports.", e1:"A", d1:"-", e2:"E", d2px:"-", concept: "Landing fee processing reduces liquid bank cash Assets and compresses Equity structures via transport expenses." },
                { q: "IndiGo receives a cash injection of ₹300 Cr through institutional commercial paper debt notes issuance.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Short-term funding notes expand liquid cash Assets and generate equivalent short-term Liabilities debt lines." },
                { q: "IndiGo provisions an aircraft engine wear-and-tear maintenance depreciation book entry of ₹70 Cr.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Maintenance provisioning lowers aircraft equipment book value Assets and lowers Equity via non-cash operating loss entries." },
                { q: "A corporate travel partner clears an old outstanding bulk ticketing balance of ₹35 Cr into IndiGo's bank account.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Receivable clearing increases liquid bank cash Assets and deflates current trade debtor Assets." },
                { q: "IndiGo settles its short-term banking bank overdraft limit balance of ₹80 Cr via automated fund sweep.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Overdraft clearing lowers digital bank cash Assets and discharges outstanding current debt Liabilities." }
            ]
        };

        const questions = {
            warmup: [
                { q: "Started an MBA venture with ₹25 Lakhs seed capital deposit.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Capital Introduction increases Assets (Cash) and increases Equity (Owner's Capital)." },
                { q: "Purchased office laptops worth ₹3 Lakhs paying cash instantly.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Asset Transformation shifts composition: Increases Assets (Equipment), decreases Assets (Cash)." },
                { q: "Procured commercial goods worth ₹4 Lakhs on credit terms from a vendor.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Credit Purchase increases Assets (Inventory) and increases Liabilities (Creditors)." },
                { q: "Disbursed ₹60,000 corporate building rent via HDFC net banking accounts.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Rent expense reduces Assets (Bank) and reduces Equity (Retained Earnings via Expense)." },
                { q: "Executed consultancy work for client; collected ₹1.5 Lakhs immediately via UPI.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Revenue Generation increases Assets (Bank) and increases Equity (Retained Earnings via Profit)." },
                { q: "Secured an emergency short-term business loan of ₹8 Lakhs from SBI.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Loan borrowing increases Assets (Bank Cash) and increases Liabilities (Bank Loan)." },
                { q: "Settled outstanding payment of ₹1.2 Lakhs owed to a raw material supplier.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Liability settlement decreases Assets (Cash/Bank) and decreases Liabilities (Accounts Payable)." },
                { q: "Rendered training services to a corporate client worth ₹2 Lakhs; payment due next month.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Accrued Revenue increases Assets (Debtors) and increases Equity (Retained Earnings)." },
                { q: "An old trade debtor clears their outstanding bill of ₹80,000 via electronic transfer.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Debtor collection increases Assets (Bank) and decreases Assets (Accounts Receivable)." },
                { q: "The company pays a corporate cash dividend of ₹1 Lakh to its equity shareholders.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Dividend payout directly reduces Assets (Cash) and reduces Equity (Retained Earnings distribution)." }
            ]
        };

        function displayRulesPlaybook() {
            const input = document.getElementById('username').value.trim();
            if(!input) { alert("Please input your name to sign the match roster!"); return; }
            playerName = input;
            document.getElementById('player-display').innerText = `Batsman: ${playerName}`;

            showScreen(`
                <div class="bg-[#162544] p-5 rounded-2xl border border-slate-700 max-w-sm w-full shadow-2xl flex flex-col max-h-[80vh]">
                    <h2 class="text-lg font-black text-amber-400 uppercase tracking-wider text-center border-b border-slate-700 pb-2 mb-3">📋 TOURNAMENT PLAYBOOK</h2>
                    
                    <div class="flex-grow overflow-y-auto space-y-3 pr-1 text-xs text-slate-200 leading-relaxed text-left font-medium">
                        <p><strong class="text-[#38bdf8]">1. Match Structure:</strong> The game consists of exactly 20 balls divided into two distinct innings (10 Warmup questions + 10 Annual Report questions).</p>
                        <p><strong class="text-[#38bdf8]">2. Double-Entry Condition:</strong> For every ball delivered, you must analyze the transaction and select the impact vectors for BOTH sides of the accounting equation ($A = L + E$).</p>
                        <p><strong class="text-[#38bdf8]">3. Time-Adaptive Scoring:</strong> Faster correct answers yield more runs (up to 6 runs per question).</p>
                        <p><strong class="text-[#38bdf8]">4. Corporate Team Draft Selection:</strong> After ball 10, you will directly select 1 of 10 major Indian companies. The match engine dynamically loads live corporate scenarios mapped to that business profile.</p>
                        <p><strong class="text-red-400">🚨 5. AI Anti-Cheat Detection:</strong> Navigating away from this tab, minimizing the browser, or opening another app during an active question will instantly result in a **Dot Ball (Time Violation - 0 Runs)**. Text selection has also been blocked to prevent external pasting.</p>
                    </div>

                    <button onclick="confirmGuardAndStart()" class="w-full mt-4 py-3 bg-emerald-500 text-slate-950 font-black rounded-xl uppercase tracking-widest text-sm shadow-md active:scale-95 transition-transform shrink-0">TAKE GUARD & PLAY</button>
                </div>
            `);
            updateCommentary(`Batsman ${playerName} is reading the pitch conditions before walking out.`);
        }

        function confirmGuardAndStart() {
            document.getElementById('top-scoreboard').classList.remove('hidden');
            startMatch();
        }

        function startMatch() {
            currentRound = 1;
            currentIdx = 0;
            totalRuns = 0;
            matchLog = [];
            renderQuestion();
        }

        function renderQuestion() {
            clearInterval(timerInterval);
            isQuestionActive = false; // Reset anti-cheat flag during initialization
            const dataset = currentRound === 1 ? questions.warmup : dynamicActiveMatchSet;
            
            if (currentIdx >= 10) {
                if (currentRound === 1) renderCompanyDraftScreen();
                else finalizeScoreAndLogSheet();
                return;
            }

            const qData = dataset[currentIdx];
            timeLeft = 30;
            currentSelection = { leg1: {e:null, d:null}, leg2: {e:null, d:null} };
            
            updateScoreboard();
            startTimer();
            isQuestionActive = true; // Engage active cheat-interception monitoring loop

            showScreen(`
                <div class="w-full max-w-sm flex flex-col space-y-3">
                    <div class="bg-slate-900/80 border border-slate-700/60 p-4 rounded-xl text-center min-h-[90px] flex items-center justify-center shadow-inner">
                        <p class="text-base font-semibold leading-snug text-slate-100">${qData.q}</p>
                    </div>

                    ${[1, 2].map(leg => `
                        <div class="bg-[#162544] p-3 rounded-xl border border-slate-700/50 shadow-md">
                            <div class="text-[10px] text-[#38bdf8] font-bold uppercase tracking-wider mb-1.5">Equation Element Vector ${leg}</div>
                            <div class="grid grid-cols-3 gap-1.5 mb-2">
                                <button onclick="select('${leg}','e','A',this)" class="py-1.5 bg-slate-800 rounded-lg text-xs font-bold transition-all">Asset</button>
                                <button onclick="select('${leg}','e','L',this)" class="py-1.5 bg-slate-800 rounded-lg text-xs font-bold transition-all">Liability</button>
                                <button onclick="select('${leg}','e','E',this)" class="py-1.5 bg-slate-800 rounded-lg text-xs font-bold transition-all">Equity</button>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5">
                                <button onclick="select('${leg}','d','+',this)" class="py-1.5 bg-slate-800 rounded-lg text-xs font-bold transition-all">Increase (+)</button>
                                <button onclick="select('${leg}','d','-',this)" class="py-1.5 bg-slate-800 rounded-lg text-xs font-bold transition-all">Decrease (-)</button>
                            </div>
                        </div>
                    `).join('')}

                    <button onclick="validate()" class="w-full py-3 bg-emerald-400 text-slate-950 font-black rounded-xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-sm">SUBMIT (HIT THE BALL)</button>
                </div>
            `);
        }

        function select(leg, type, val, btn) {
            currentSelection[`leg${leg}`][type] = val;
            const parent = btn.parentElement;
            [...parent.children].forEach(c => c.classList.remove('selected-btn'));
            btn.classList.add('selected-btn');
        }

        function validate() {
            const s = currentSelection;
            if(!s.leg1.e || !s.leg1.d || !s.leg2.e || !s.leg2.d) { alert("Accounting requires tracking BOTH metrics of the equation system!"); return; }
            
            clearInterval(timerInterval);
            isQuestionActive = false; // Disengage cheat monitoring hook on active submission
            const dataset = currentRound === 1 ? questions.warmup : dynamicActiveMatchSet;
            const q = dataset[currentIdx];

            const correct = (s.leg1.e===q.e1 && s.leg1.d===q.d1 && s.leg2.e===q.e2 && s.leg2.d===q.d2) || 
                            (s.leg2.e===q.e1 && s.leg2.d===q.d1 && s.leg1.e===q.e2 && s.leg1.d===q.d2);

            let runsScored = 0;
            let overlayHTML = "";

            if (correct) {
                if (timeLeft >= 20) {
                    runsScored = 6;
                    overlayHTML = `<h1 class="text-5xl font-black text-emerald-400 tracking-tighter mb-1">💥 SIX!</h1><p class="text-xs uppercase font-bold tracking-widest text-white/90">Incredible Timing! +6 Runs</p>`;
                    updateCommentary(`${playerName} hits a MONSTER SIX! (+6 Runs)`, true);
                } else if (timeLeft >= 15) {
                    runsScored = 4;
                    overlayHTML = `<h1 class="text-5xl font-black text-cyan-400 tracking-tighter mb-1">⚡ FOUR!</h1><p class="text-xs uppercase font-bold tracking-widest text-white/90">To the Boundary! +4 Runs</p>`;
                    updateCommentary(`${playerName} hits a GLORIOUS BOUNDARY! (+4 Runs)`, true);
                } else if (timeLeft >= 10) {
                    runsScored = 3;
                    overlayHTML = `<h1 class="text-4xl font-black text-amber-400 mb-1">🏏 3 RUNS</h1><p class="text-xs uppercase font-bold tracking-wider text-white/90">Excellent running between wickets!</p>`;
                    updateCommentary(`${playerName} takes 3 runs. Great hustle!`, true);
                } else if (timeLeft >= 5) {
                    runsScored = 2;
                    overlayHTML = `<h1 class="text-4xl font-black text-lime-400 mb-1">🏃 2 RUNS</h1><p class="text-xs uppercase font-bold tracking-wider text-white/90">Worked softly into the gap.</p>`;
                    updateCommentary(`${playerName} plays it safe for a couple.`, true);
                } else {
                    runsScored = 1;
                    overlayHTML = `<h1 class="text-3xl font-black text-slate-300 mb-1">☝️ 1 RUN</h1><p class="text-xs uppercase font-bold tracking-wider text-white/90">Just a single before the buzzer.</p>`;
                    updateCommentary(`${playerName} steals a single run.`, true);
                }
                totalRuns += runsScored;
            } else {
                overlayHTML = `<h1 class="text-4xl font-black text-rose-500 tracking-wide mb-1">🚨 HOWZAT!</h1><p class="text-xs uppercase font-bold tracking-widest text-white/90">Clean Bowled! 0 Runs</p>`;
                updateCommentary(`HOWZAT! ${playerName} missed the line completely. CLEAN BOWLED!`, false);
            }

            matchLog.push({
                question: q.q,
                wasCorrect: correct,
                runs: runsScored,
                concept: q.concept
            });

            currentIdx++;
            renderPostBallCard(overlayHTML, q.concept);
        }

        function renderPostBallCard(overlayHTML, conceptText) {
            showScreen(`
                <div class="absolute inset-0 bg-black/75 flex flex-col items-center justify-center p-4 z-50">
                    <div class="pop-card bg-[#162544] p-6 rounded-2xl text-center shadow-2xl border border-slate-700 max-w-xs w-full flex flex-col items-center space-y-4">
                        <div>${overlayHTML}</div>
                        <div class="w-full border-t border-slate-700/60 pt-3 text-left">
                            <span class="text-[10px] uppercase font-bold text-[#38bdf8] block tracking-wide">Umpire's Verification:</span>
                            <p class="text-[11px] text-slate-300 leading-normal font-medium mt-0.5">${conceptText}</p>
                        </div>
                        <button onclick="renderQuestion()" class="w-full py-3 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black rounded-xl uppercase tracking-wider text-xs shadow-md active:scale-95 transition-transform">
                            READY FOR NEXT BALL 🏏
                        </button>
                    </div>
                </div>
            `);
        }

        function triggerAntiCheatInfraction() {
            if (!isQuestionActive) return; // Ignore tracking alerts if a student is on intermission screens
            
            clearInterval(timerInterval);
            isQuestionActive = false; // Disengage active query metrics

            const dataset = currentRound === 1 ? questions.warmup : dynamicActiveMatchSet;
            const q = dataset[currentIdx];

            updateCommentary(`⚠️ FOUL PLAY! ${playerName} left the field environment tab to open another application.`, false);

            matchLog.push({
                question: q.q,
                wasCorrect: false,
                runs: 0,
                concept: "TAB INFRACTION PENALTY: Moving focus away from active ledger windows automatically declares a strict Dot Ball dismissal."
            });

            currentIdx++;

            const penaltyHTML = `<h1 class="text-4xl font-black text-orange-500 mb-1">⚠️ DOT BALL</h1><p class="text-xs uppercase font-bold tracking-wider text-white/90">AI Cheat Infraction Detected!</p>`;
            renderPostBallCard(penaltyHTML, "TAB INFRACTION PENALTY: Leaving the app interface triggers an automatic safety validation penalty.");
        }

        // BROWSER FOUNT EVENTS INTERCEPTION (TAB VISIBILITY & LOSS OF FOCUS ANTI-CHEAT TRIGGER)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) triggerAntiCheatInfraction();
        });
        window.addEventListener("blur", () => {
            triggerAntiCheatInfraction();
        });

        function startTimer() {
            document.getElementById('timer').innerText = timeLeft + "s";
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if(timeLeft <= 5) document.getElementById('timer-box').className = "bg-rose-500 text-white px-4 py-2 rounded-lg text-center min-w-[75px] font-bold animate-pulse";
                if(timeLeft <= 0) { 
                    clearInterval(timerInterval); 
                    isQuestionActive = false;
                    updateCommentary(`🛑 DOT BALL! ${playerName} took too long to read the field assignment.`, false); 
                    
                    matchLog.push({
                        question: (currentRound === 1 ? questions.warmup : dynamicActiveMatchSet)[currentIdx].q,
                        wasCorrect: false,
                        runs: 0,
                        concept: (currentRound === 1 ? questions.warmup : dynamicActiveMatchSet)[currentIdx].concept
                    });
                    currentIdx++; 

                    showScreen(`
                        <div class="absolute inset-0 bg-black/75 flex flex-col items-center justify-center p-4 z-50">
                            <div class="pop-card bg-[#162544] p-6 rounded-2xl text-center shadow-2xl border border-slate-700 max-w-xs w-full flex flex-col items-center space-y-4">
                                <div>
                                    <h1 class="text-4xl font-black text-orange-500 mb-1">⏱️ DOT BALL</h1>
                                    <p class="text-xs uppercase font-bold tracking-wider text-white/90">Time Expired! No Run</p>
                                </div>
                                <button onclick="renderQuestion()" class="w-full py-3 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black rounded-xl uppercase tracking-wider text-xs shadow-md active:scale-95 transition-transform">
                                    READY FOR NEXT BALL 🏏
                                </button>
                            </div>
                        </div>
                    `);
                }
            }, 1000);
        }

        function renderCompanyDraftScreen() {
            document.getElementById('top-scoreboard').classList.add('hidden');
            const companiesList = Object.keys(corporateDatabase);
            
            let gridButtonsHTML = companiesList.map(comp => `
                <button onclick="selectCorporateTeam('${comp}')" class="py-2.5 px-3 bg-slate-900 border border-slate-700 hover:border-[#38bdf8] text-slate-200 font-bold text-xs rounded-xl tracking-wide transition-all active:scale-95 text-center">
                    ${comp}
                </button>
            `).join('');

            showScreen(`
                <div class="bg-[#162544] p-5 rounded-2xl border border-slate-700 w-full max-w-sm shadow-2xl flex flex-col max-h-[85vh]">
                    <h2 class="text-base font-black text-amber-400 uppercase tracking-wider text-center mb-1">🏏 CORPORATE TEAM DRAFT</h2>
                    <p class="text-[11px] text-slate-300 text-center mb-4">Select 1 Indian company balance sheet model to construct the Main Match questions.</p>
                    
                    <div class="flex-grow overflow-y-auto grid grid-cols-2 gap-2.5 pr-1">
                        ${gridButtonsHTML}
                    </div>
                </div>
            `);
            updateCommentary(`First innings complete. ${playerName} is selecting their corporate ledger playing arena...`);
        }

        function selectCorporateTeam(companyName) {
            identifiedCompany = companyName;
            dynamicActiveMatchSet = corporateDatabase[companyName];
            updateCommentary(`Loading live operating ledger questions for ${identifiedCompany}!`, true);
            
            document.getElementById('top-scoreboard').classList.remove('hidden');
            currentRound = 2;
            currentIdx = 0;
            renderQuestion();
        }

        function updateScoreboard() {
            document.getElementById('runs').innerText = totalRuns;
            const displayBallCount = currentRound === 1 ? currentIdx : currentIdx + 10;
            document.getElementById('ball-counter').innerText = `${displayBallCount}/20 Balls`;
            document.getElementById('timer-box').className = "bg-emerald-400 text-slate-950 px-3.5 py-1.5 rounded-lg text-center min-w-[75px] font-bold";
        }

        function finalizeScoreAndLogSheet() {
            document.getElementById('top-scoreboard').classList.add('hidden');
            updateCommentary("Transmitting innings card telemetry to the central ledger dashboard...");

            const payload = {
                studentName: playerName,
                totalScore: totalRuns,
                targetCompany: identifiedCompany,
                timestamp: new Date().toISOString()
            };

            if (GOOGLE_SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).then(() => console.log("Telemetry captured seamlessly."))
                  .catch(err => console.error("Cloud tracking error", err));
            }

            renderGameOver();
        }

        function renderGameOver() {
            let scorecardSummaryHTML = "";
            matchLog.forEach((item, idx) => {
                scorecardSummaryHTML += `
                    <div class="p-3 rounded-lg text-left text-xs ${item.wasCorrect ? 'bg-emerald-950/30 border border-emerald-800/40' : 'bg-rose-950/30 border border-rose-900/40'} space-y-1">
                        <div class="font-bold text-slate-200">Ball ${idx+1}: ${item.question}</div>
                        <div class="flex justify-between font-medium">
                            <span class="${item.wasCorrect ? 'text-emerald-400' : 'text-rose-400'}">Result: ${item.wasCorrect ? `Hit for ${item.runs} Runs` : 'Clean Bowled'}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 bg-black/20 p-2 rounded border border-slate-800 mt-1">
                            <span class="text-[#38bdf8] font-bold">Accounting Concept:</span> ${item.concept}
                        </div>
                    </div>
                `;
            });

            showScreen(`
                <div class="text-center bg-[#162544] p-5 rounded-2xl border border-slate-700 shadow-2xl max-w-sm w-full mx-auto my-auto flex flex-col h-full max-h-[90vh]">
                    <div class="celebrate-pulse mb-3">
                        <span class="text-3xl">🏆🎆🎉</span>
                        <h2 class="text-2xl font-black text-amber-400 tracking-tight mt-1">CHAMPIONSHIP CELEBRATION!</h2>
                        <p class="text-xs text-slate-300">Incredible innings, <span class="text-[#38bdf8] font-bold">${playerName}</span>!</p>
                    </div>

                    <div class="bg-slate-900/90 border border-slate-700 py-3 px-6 rounded-xl mx-auto mb-4 min-w-[150px]">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Final Score</div>
                        <div class="text-4xl font-black text-[#38bdf8]">${totalRuns} <span class="text-xs text-slate-400 font-bold">RUNS</span></div>
                    </div>

                    <h3 class="text-left text-xs uppercase font-bold tracking-wider text-slate-400 mb-1.5 px-1">Post-Match Performance Ledger</h3>
                    <div class="flex-grow overflow-y-auto space-y-2.5 pr-1 mb-4 border-t border-slate-700/60 pt-3">
                        ${scorecardSummaryHTML}
                    </div>

                    <button onclick="init()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl text-xs uppercase tracking-widest active:scale-95 transition-transform shrink-0">Play New Tournament</button>
                </div>
            `);
            updateCommentary(`The stadium erupts! Unbelievable batting exhibition by ${playerName}!`);
        }

        window.onload = init;
    </script>
</body>
</html>
